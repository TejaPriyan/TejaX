# TejaX — full production stack.
# Local dev can run the API + web with plain Python/Node (see README);
# this compose brings up PostgreSQL(+pgvector), Redis, the API and the web app.
#
#   docker compose up --build

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tejax
      POSTGRES_PASSWORD: tejax
      POSTGRES_DB: tejax
    ports:
      - "5432:5432"
    volumes:
      - tejax_pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tejax"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://tejax:tejax@db:5432/tejax
      REDIS_URL: redis://redis:6379/0
      MODEL_PROVIDER: ${MODEL_PROVIDER:-demo}
      MODEL_NAME: ${MODEL_NAME:-}
      BASE_URL: ${BASE_URL:-}
      API_KEY: ${API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      SANDBOX_BACKEND: ${SANDBOX_BACKEND:-local}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "5173:5173"
    environment:
      TEJAX_API_URL: http://api:8000
    depends_on:
      - api

volumes:
  tejax_pgdata:
